name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * *"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly

      - name: Fetch Google Scholar citation counts
        env:
          GOOGLE_SCHOLAR_ID: dthwMXwAAAAJ
        run: python scripts/update_scholar_citations.py

      - name: Commit citation data
        run: |
          if git diff --quiet assets/data/scholar_citations.json; then
            echo "Citation data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar_citations.json
          git commit -m "Update Google Scholar citation counts"
          git push
